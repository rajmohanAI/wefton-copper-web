name: CI

on:
  pull_request:
    branches:
      - main
      - feature/dev
      - feature/qa
      - feature/pp
  push:
    branches:
      - main
      - feature/dev
      - feature/qa
      - feature/pp

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wefton-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: wefton-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint CSS (no unlayered rules)
        run: npm run lint:css

      - name: Test
        run: npm test

  layout:
    name: Layout checks (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wefton-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: wefton-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The public Firebase web config lives in apphosting.yaml; reuse it so the
      # build renders real Firestore data, as on the live site.
      - name: Write .env.local from apphosting.yaml
        run: node scripts/env-from-apphosting.mjs > .env.local

      - name: Build
        run: npm run build

      - name: Layout checks (375 / 768 / 1024 / 1440)
        run: npm run test:layout

      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: wefton-platform/playwright-report/
          retention-days: 14
